name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p keeper-core --locked
      - run: cargo test -p keeper-usage-panel --bin KeeperUsagePanel --locked
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          CARGO_BUILD_JOBS: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: KeeperUsagePanel-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/KeeperUsagePanel.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
