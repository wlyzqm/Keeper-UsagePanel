name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project desktop/KeeperUsagePanel.Core.Tests -c Release
      - run: dotnet publish desktop/KeeperUsagePanel/KeeperUsagePanel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: KeeperUsagePanel-windows-x64
          path: dist/windows-x64/
